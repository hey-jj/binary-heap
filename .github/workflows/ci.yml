name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: cargo build
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --check

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.56.0 --profile minimal
      # The floor is a promise about the shipped library, so this job builds it and runs the
      # examples in its docs. `check --lib` compiled neither the doctests nor anything else a
      # reader copies. The full test suite runs on stable in the gate job above.
      #
      # `cargo test --doc` compiles dev-dependencies, which is safe here only because this crate
      # declares none. A crate that has them must strip them or drop this second command.
      - run: cargo +1.56.0 build --lib --locked
      - run: cargo +1.56.0 test --doc --locked
