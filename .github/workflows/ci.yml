name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: cargo build
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --check

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.56.0 --profile minimal
      # Tests and doctests too. `check --lib` compiled neither, so the declared floor held for the
      # library and went untested on the examples a reader copies.
      #
      # The two skipped tests build `vec![(); usize::MAX]`. On 1.56.0 that writes every element in
      # a loop and never returns. Later releases build it in constant time. Nothing in this crate
      # is involved, and the gate job above runs both tests in full.
      - run: cargo +1.56.0 test --locked -- --skip a_full_length_heap_of_zero_sized_elements --skip push_past_the_zero_sized_length_limit
